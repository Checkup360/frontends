name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [web, dashboard, backoffice]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/frontends-${{ matrix.app }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP=${{ matrix.app }}
            VITE_PUBLIC_API_ORIGIN=${{ vars.VITE_PUBLIC_API_ORIGIN || 'http://localhost:8000' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  trigger-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Get latest backend tag
        id: backend
        run: |
          TAG=$(gh api \
            repos/${{ github.repository_owner }}/backend/tags \
            --jq '.[0].name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger infra deploy workflow
        run: |
          gh workflow run deploy-staging.yml \
            --repo ${{ github.repository_owner }}/infra \
            -f backend_version=${{ steps.backend.outputs.tag }} \
            -f frontends_version=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
