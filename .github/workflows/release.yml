name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [web, dashboard, backoffice]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/frontends-${{ matrix.app }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP=${{ matrix.app }}
            VITE_PUBLIC_API_ORIGIN=${{ vars.VITE_PUBLIC_API_ORIGIN || 'http://localhost:8000' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  update-version:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/infra
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Update frontends version in staging.yml
        uses: mikefarah/yq@v4.53.2
        with:
          cmd: yq -i '.frontends = "${{ github.ref_name }}"' versions/staging.yml

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          commit-message: "chore(staging): update frontends to ${{ github.ref_name }}"
          branch: "update/frontends-${{ github.ref_name }}"
          delete-branch: true
          title: "Staging Deploy: Frontends ${{ github.ref_name }}"
          body: |
            Automated version update from frontends release
            
            **Frontends**: `${{ github.ref_name }}`
            **Backend**: [latest in versions/staging.yml]
            
            This PR updates the frontends version for staging. Once approved and merged, the deployment will start automatically.
          labels: deployment,automated
